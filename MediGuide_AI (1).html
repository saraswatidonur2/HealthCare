<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MediGuide AI</title>
<style>
:root{--bg:#f4f9fb;--c:#fff;--t:#12303a;--m:#5d7882;--p:#0e8fa8;--g:#19a974;--bd:#dcebf0;--r:#d64545;--w:#f2994a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b21;--c:#14272f;--t:#e6f3f6;--m:#93b0b9;--bd:#244049}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--p)}nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{border:0;background:none;padding:8px 12px;border-radius:99px;color:var(--m);font-weight:600}nav button.on{background:var(--p);color:#fff}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;font-weight:700}.live{background:#dff6ec;color:#0b7a52}.off{background:#ffe9d2;color:#a85b0f}
main{max-width:1100px;margin:auto;padding:16px}h1{font-size:30px;margin:8px 0}h2{margin:20px 0 8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 2px 10px #0e8fa81a}
.hero{background:linear-gradient(135deg,#e0f5f8,#e2f7ec);border-radius:24px;padding:28px;color:#12303a}.hero p{color:#3b5b66}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.o{background:none;border:1.5px solid var(--p);color:var(--p)}.btn.s{padding:6px 10px;font-size:14px}
input,select{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:12px;background:var(--c);margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.m{color:var(--m);font-size:14px}.chip{border:1.5px solid var(--bd);background:var(--c);border-radius:99px;padding:6px 12px;font-size:14px}
.big{font-size:40px}.st{color:#f5a623}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e0f2f6;color:#0a6c80;font-weight:700}
.chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}#msgs{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--c);border:1px solid var(--bd)}.u{align-self:flex-end;background:var(--p);color:#fff;border:0}
.slot{display:block;width:100%;text-align:left;margin:4px 0;border:1.5px solid var(--p);background:none;border-radius:12px;padding:8px 12px;color:var(--t)}.slot:hover{background:var(--p);color:#fff}
.emg{background:#fde8e8;border:2px solid var(--r);color:#7a1d1d;border-radius:16px;padding:12px}
.prog{display:flex;gap:4px;font-size:12px;margin:4px 0}.prog span{flex:1;text-align:center;padding:4px;border-radius:8px;background:var(--bd);color:var(--m)}.prog .on{background:var(--g);color:#fff}
.ok{border:2px solid var(--g);background:#effaf5;color:#12303a;border-radius:16px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12303a;color:#fff;padding:10px 18px;border-radius:99px;z-index:9}
.mic.rec{background:var(--r);animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
@media(max-width:700px){nav{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap}h1{font-size:24px}}
</style></head><body>
<header><span class="logo">⚕ MediGuide AI</span><nav id="nav"></nav><span id="st" class="pill"></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const LANGS={en:["English","en-IN"],hi:["हिन्दी","hi-IN"],kn:["ಕನ್ನಡ","kn-IN"],te:["తెలుగు","te-IN"],ta:["தமிழ்","ta-IN"],ml:["മലയാളം","ml-IN"],mr:["मराठी","mr-IN"],bn:["বাংলা","bn-IN"],gu:["ગુજરાતી","gu-IN"],pa:["ਪੰਜਾਬੀ","pa-IN"],or:["ଓଡ଼ିଆ","or-IN"],ur:["اردو","ur-IN"]};
// g greet, a ask, s slots, v verify, n pay, c confirmed, e emergency, x none
const T={
en:{g:"Hi! 👋 How can I help you today?",a:"Tell me your concern (fever, tooth pain, knee pain…) or a doctor’s name.",s:"Available appointments — pick one:",v:"We’ll verify your mobile number before confirming.",n:"Confirm patient details and pay the fee (demo).",c:"Appointment confirmed ✓",e:"This may need urgent medical attention. Call the doctor or emergency services (112) now.",x:"No suitable slot right now. You can join the waitlist."},
hi:{g:"नमस्ते! 👋 मैं आपकी कैसे मदद कर सकता हूँ?",a:"अपनी समस्या बताइए (बुखार, दांत दर्द, घुटने का दर्द…) या डॉक्टर का नाम।",s:"उपलब्ध अपॉइंटमेंट — चुनिए:",v:"पुष्टि से पहले हम आपका मोबाइल नंबर सत्यापित करेंगे।",n:"मरीज़ का विवरण जाँचें और शुल्क दें (डेमो)।",c:"अपॉइंटमेंट पक्का हो गया ✓",e:"यह आपातकालीन हो सकता है। अभी डॉक्टर या 112 को कॉल करें।",x:"अभी कोई स्लॉट नहीं है। आप वेटलिस्ट में जुड़ सकते हैं।"},
kn:{g:"ನಮಸ್ಕಾರ! 👋 ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಬಹುದು?",a:"ನಿಮ್ಮ ತೊಂದರೆ ಹೇಳಿ (ಜ್ವರ, ಹಲ್ಲು ನೋವು, ಮೊಣಕಾಲು ನೋವು…) ಅಥವಾ ವೈದ್ಯರ ಹೆಸರು.",s:"ಲಭ್ಯವಿರುವ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್‌ಗಳು — ಆಯ್ಕೆಮಾಡಿ:",v:"ದೃಢೀಕರಿಸುವ ಮೊದಲು ನಿಮ್ಮ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತೇವೆ.",n:"ರೋಗಿಯ ವಿವರ ಪರಿಶೀಲಿಸಿ ಶುಲ್ಕ ಪಾವತಿಸಿ (ಡೆಮೊ).",c:"ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ದೃಢಪಟ್ಟಿದೆ ✓",e:"ಇದು ತುರ್ತು ಆಗಿರಬಹುದು. ಈಗಲೇ ವೈದ್ಯರಿಗೆ ಅಥವಾ 112ಕ್ಕೆ ಕರೆ ಮಾಡಿ.",x:"ಈಗ ಸ್ಲಾಟ್ ಇಲ್ಲ. ವೇಟ್‌ಲಿಸ್ಟ್‌ಗೆ ಸೇರಬಹುದು."},
te:{g:"నమస్తే! 👋 నేను మీకు ఎలా సహాయం చేయగలను?",a:"మీ సమస్య చెప్పండి (జ్వరం, పంటి నొప్పి, మోకాలి నొప్పి…) లేదా డాక్టర్ పేరు.",s:"అందుబాటులో ఉన్న అపాయింట్‌మెంట్లు — ఎంచుకోండి:",v:"నిర్ధారించే ముందు మీ మొబైల్ నంబర్ ధృవీకరిస్తాము.",n:"రోగి వివరాలు చూసి ఫీజు చెల్లించండి (డెమో).",c:"అపాయింట్‌మెంట్ నిర్ధారించబడింది ✓",e:"ఇది అత్యవసరం కావచ్చు. వెంటనే డాక్టర్‌కు లేదా 112కు కాల్ చేయండి.",x:"ప్రస్తుతం స్లాట్ లేదు. వెయిట్‌లిస్ట్‌లో చేరండి."},
ta:{g:"வணக்கம்! 👋 நான் எப்படி உதவலாம்?",a:"உங்கள் பிரச்சனையைச் சொல்லுங்கள் (காய்ச்சல், பல் வலி, முழங்கால் வலி…) அல்லது மருத்துவர் பெயர்.",s:"கிடைக்கும் நேரங்கள் — தேர்வு செய்யுங்கள்:",v:"உறுதிப்படுத்தும் முன் உங்கள் மொபைல் எண்ணைச் சரிபார்ப்போம்.",n:"நோயாளி விவரங்களைச் சரிபார்த்துக் கட்டணம் செலுத்துங்கள் (டெமோ).",c:"நேரம் உறுதியானது ✓",e:"இது அவசரமாக இருக்கலாம். உடனே மருத்துவர் அல்லது 112-ஐ அழைக்கவும்.",x:"இப்போது நேரம் இல்லை. காத்திருப்புப் பட்டியலில் சேரலாம்."},
ml:{g:"നമസ്കാരം! 👋 ഞാൻ എങ്ങനെ സഹായിക്കണം?",a:"നിങ്ങളുടെ പ്രശ്നം പറയൂ (പനി, പല്ലുവേദന, മുട്ടുവേദന…) അല്ലെങ്കിൽ ഡോക്ടറുടെ പേര്.",s:"ലഭ്യമായ അപ്പോയിന്റ്മെന്റുകൾ — തിരഞ്ഞെടുക്കൂ:",v:"സ്ഥിരീകരിക്കും മുമ്പ് മൊബൈൽ നമ്പർ പരിശോധിക്കും.",n:"രോഗിയുടെ വിവരങ്ങൾ പരിശോധിച്ച് ഫീസ് അടയ്ക്കൂ (ഡെമോ).",c:"അപ്പോയിന്റ്മെന്റ് സ്ഥിരീകരിച്ചു ✓",e:"ഇത് അടിയന്തരമായേക്കാം. ഉടൻ ഡോക്ടറെയോ 112 നെയോ വിളിക്കുക.",x:"ഇപ്പോൾ സ്ലോട്ട് ഇല്ല. വെയിറ്റ്‌ലിസ്റ്റിൽ ചേരാം."},
mr:{g:"नमस्कार! 👋 मी तुम्हाला कशी मदत करू?",a:"तुमची समस्या सांगा (ताप, दातदुखी, गुडघेदुखी…) किंवा डॉक्टरांचे नाव.",s:"उपलब्ध अपॉइंटमेंट — निवडा:",v:"खात्री करण्यापूर्वी तुमचा मोबाइल नंबर तपासू.",n:"रुग्णाचा तपशील तपासा आणि शुल्क भरा (डेमो).",c:"अपॉइंटमेंट निश्चित झाली ✓",e:"हे तातडीचे असू शकते. आत्ताच डॉक्टर किंवा 112 ला कॉल करा.",x:"सध्या स्लॉट नाही. वेटलिस्टमध्ये सामील व्हा."},
bn:{g:"নমস্কার! 👋 আমি কীভাবে সাহায্য করতে পারি?",a:"আপনার সমস্যা বলুন (জ্বর, দাঁতে ব্যথা, হাঁটুতে ব্যথা…) বা ডাক্তারের নাম।",s:"উপলব্ধ অ্যাপয়েন্টমেন্ট — বেছে নিন:",v:"নিশ্চিত করার আগে আপনার মোবাইল নম্বর যাচাই করব।",n:"রোগীর তথ্য দেখে ফি দিন (ডেমো)।",c:"অ্যাপয়েন্টমেন্ট নিশ্চিত হয়েছে ✓",e:"এটি জরুরি হতে পারে। এখনই ডাক্তার বা ১১২-এ কল করুন।",x:"এখন স্লট নেই। ওয়েটলিস্টে যোগ দিন।"},
gu:{g:"નમસ્તે! 👋 હું તમને કેવી રીતે મદદ કરી શકું?",a:"તમારી સમસ્યા કહો (તાવ, દાંતનો દુખાવો, ઘૂંટણનો દુખાવો…) અથવા ડૉક્ટરનું નામ.",s:"ઉપલબ્ધ એપોઇન્ટમેન્ટ — પસંદ કરો:",v:"પુષ્ટિ પહેલાં તમારો મોબાઇલ નંબર ચકાસીશું.",n:"દર્દીની વિગતો તપાસી ફી ચૂકવો (ડેમો).",c:"એપોઇન્ટમેન્ટ કન્ફર્મ ✓",e:"આ તાત્કાલિક હોઈ શકે. હમણાં જ ડૉક્ટર અથવા 112 ને કૉલ કરો.",x:"હાલ સ્લોટ નથી. વેઇટલિસ્ટમાં જોડાઓ."},
pa:{g:"ਸਤ ਸ੍ਰੀ ਅਕਾਲ! 👋 ਮੈਂ ਤੁਹਾਡੀ ਕਿਵੇਂ ਮਦਦ ਕਰਾਂ?",a:"ਆਪਣੀ ਸਮੱਸਿਆ ਦੱਸੋ (ਬੁਖਾਰ, ਦੰਦ ਦਰਦ, ਗੋਡੇ ਦਰਦ…) ਜਾਂ ਡਾਕਟਰ ਦਾ ਨਾਮ।",s:"ਉਪਲਬਧ ਅਪਾਇੰਟਮੈਂਟ — ਚੁਣੋ:",v:"ਪੁਸ਼ਟੀ ਤੋਂ ਪਹਿਲਾਂ ਤੁਹਾਡਾ ਮੋਬਾਈਲ ਨੰਬਰ ਜਾਂਚਾਂਗੇ।",n:"ਮਰੀਜ਼ ਦੇ ਵੇਰਵੇ ਦੇਖੋ ਅਤੇ ਫੀਸ ਭਰੋ (ਡੈਮੋ)।",c:"ਅਪਾਇੰਟਮੈਂਟ ਪੱਕੀ ਹੋ ਗਈ ✓",e:"ਇਹ ਐਮਰਜੈਂਸੀ ਹੋ ਸਕਦੀ ਹੈ। ਹੁਣੇ ਡਾਕਟਰ ਜਾਂ 112 ਨੂੰ ਕਾਲ ਕਰੋ।",x:"ਹੁਣ ਕੋਈ ਸਲਾਟ ਨਹੀਂ। ਵੇਟਲਿਸਟ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਵੋ।"},

 return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MediGuide AI//EN","BEGIN:VEVENT","UID:"+a.id+"@mediguide","DTSTAMP:"+s,"DTSTART:"+s,"DTEND:"+e,"SUMMARY:Appointment with "+d.n,"LOCATION:"+d.h,"DESCRIPTION:Patient "+a.pn+" - "+DEPT[d.d][1],"BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Appointment reminder","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n")}

// voice
// Voice: continuous hands-free listening, on-device recognition when the browser supports it (works offline)
let rec=null,micOn=false,speaking=false,localOK=false,micErr=0;
const SRC=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
function micUI(){const b=$("#mic"),h=$("#hint");if(b)b.classList.toggle("rec",micOn);if(h)h.textContent=micOn?(speaking?"Assistant speaking… I’ll listen again in a moment":"🎙 Listening… speak naturally, tap 🎤 to stop"):"Tap microphone and speak"}
async function prepLocal(r,lang){try{const C=SRC();if(C&&C.available){const o={langs:[lang],processLocally:true},st=await C.available(o);if(st==="unavailable")return false;if(st!=="available"&&C.install)await C.install(o);r.processLocally=true;return true}}catch(e){}return false}
async function startRec(){const C=SRC();if(!micOn||rec||speaking||!C)return;
 const r=new C(),lang=LANGS[L()][1];r.lang=lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
 localOK=await prepLocal(r,lang);if(!micOn||rec||speaking)return;rec=r;
 r.onstart=()=>{micErr=0;micUI()};
 r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t}
  const inp=$("#inp");if(inp)inp.value=tmp;
  if(fin.trim()){if(inp)inp.value="";send(fin.trim());idle()}};
 r.onerror=e=>{const c=e.error;if(c==="no-speech"||c==="aborted")return;
  if(c==="not-allowed"||c==="service-not-allowed"){micOn=false;toast("Microphone permission is blocked — allow it in browser settings, or type your message.")}
  else if(c==="network"||c==="language-not-supported"){micOn=false;toast(localOK?"Voice language not available — please type.":"This browser needs internet for voice. Use Chrome with an offline speech pack, or type / tap the suggestions.")}
  else if(++micErr>4){micOn=false;toast("Voice input unavailable — please type.")}
  micUI()};
 r.onend=()=>{rec=null;if(micOn&&!speaking)setTimeout(startRec,250);else micUI()};
 try{r.start()}catch(e){rec=null}}
function mic(){if(!SRC()){toast("Speech recognition isn’t supported on this browser — please type.");return}
 micOn=!micOn;if(micOn){micErr=0;try{speechSynthesis.cancel()}catch(e){}speaking=false;startRec()}else{try{rec&&rec.abort()}catch(e){}rec=null}micUI()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

function hospCards(k){return HOS[k].map(h=>`<div class="card"><b>🏥 ${h[0]}</b> ${stars(h[1])}<div class="m">${h[2].map(r=>"“"+r+"”").join("<br>")}</div></div>`).join("")}
function chatPage(){return`<div class="card chat"><div class="row"><b>MediGuide AI Assistant</b><span class="tag">${DEPT[dept][1]}</span><span style="flex:1"></span><select id="lg" style="width:auto">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===L()?"selected":""}>${v[0]}</option>`).join("")}</select><button class="chip" data-a="spk">${speakOn?"🔊":"🔇"}</button><button class="btn r s" data-a="emg">🚨 Emergency</button></div><div id="msgs"></div><div class="m" id="hint" style="text-align:center">Tap microphone and speak</div><div class="row" style="flex-wrap:nowrap"><button class="btn mic${micOn?" rec":""}" id="mic" data-a="mic">🎤</button><input id="inp" placeholder="Type your message…" autocomplete="off"><button class="btn" data-a="sendbtn">Send</button></div></div>`}
function paintChat(){const m=$("#msgs");if(!m)return;m.innerHTML=msgs.map(x=>`<div class="b ${x.r}">${x.h}</div>`).join("");m.scrollTop=m.scrollHeight}
function openChat(pre){view="chat";flow=pre||flow;if(!msgs.length){say("b",T[L()].g);say("b",T[L()].a+"<br>"+["I have a fever and cough.","I need a dental cleaning.","My knee has been hurting.","Ayurveda consultation","Cancel my appointment"].map(x=>`<button class="chip" data-a="say" data-t="${x}">${x}</button>`).join(" "))}render()}
function render(){const a=$("#app");$("#st").className="pill "+(online?"live":"off");$("#st").textContent=online?"🟢 Live Mode":"🟠 Offline Demo Mode";
 $("#nav").innerHTML=view==="landing"||view==="auth"||view==="lang"?"":[["home","Home"],["dept:dental","Dental"],["dept:general","General"],["dept:physio","Physio"],["dept:ayur","Ayurveda"],["chat","AI Assistant"],["dash","Dashboard"],["doc","Admin"],["profile","Profile"]].map(([k,n])=>`<button class="${view===k||k==="dept:"+dept&&view==="dept"?"on":""}" data-a="go" data-v="${k}">${n}</button>`).join("");
 const f=V[view];a.innerHTML=f?f():"";if(view==="chat"){paintChat();micUI()}window.scrollTo(0,0)}

dash:()=>{const m=mine().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),now=ymd(new Date()),up=m.filter(a=>a.status==="Confirmed"&&a.date>=now),done=m.filter(a=>a.status==="Completed");
 const row=a=>{const d=D.find(x=>x.id===a.doc);return`<div class="card"><b>${d.n}</b> <span class="tag">${a.status}</span><div class="m">${DEPT[d.d][1]} · ${d.h}<br>${fmtD(a.date)} at ${fmtT(a.time)} · ${a.pn} (${a.rel}) · ₹${a.fee}${a.rc?` · Paid ✓ · Rescheduled ${a.rc}×`:""}</div>${a.status==="Confirmed"?`<div class="row" style="margin-top:6px"><button class="btn s" data-a="ics" data-id="${a.id}">📅 Calendar</button><button class="btn s o" data-a="resch" data-id="${a.id}">Reschedule</button><button class="btn s r" data-a="cancel" data-id="${a.id}">Cancel</button><a class="btn s o" href="tel:${d.ph}">📞 Call</a></div>`:""}</div>`};
 const nx=up[0],nd=nx&&D.find(x=>x.id===nx.doc);
 return`<h1>My Dashboard</h1><div class="m">Today: ${new Date().toLocaleString("en-IN",{dateStyle:"full",timeStyle:"short"})}</div>${nx?`<div class="ok" style="margin:10px 0"><b>⏰ Upcoming: ${nd.n}</b> — ${fmtD(nx.date)} at ${fmtT(nx.time)} (${nd.h})<br><b>Preparation:</b> <span class="m">Carry a photo ID and any previous reports/prescriptions. Arrive 10 minutes early. Follow fasting or other instructions only if your clinic provides them.</span></div>`:'<div class="card">No upcoming appointment.</div>'}<h2>Upcoming</h2><div class="grid">${up.map(row).join("")||'<span class="m">None</span>'}</div><h2>History</h2><div class="grid">${m.filter(a=>!up.includes(a)).map(row).join("")||'<span class="m">None</span>'}</div>${done.length?`<h2>Follow-up</h2><div class="card">How was your appointment with ${D.find(x=>x.id===done[done.length-1].doc).n}?<div class="row"><button class="chip" data-a="toast" data-t="Glad to hear it!">Good</button><button class="chip" data-a="fu" data-id="${done[done.length-1].doc}">Need follow-up</button><a class="chip" href="tel:${D.find(x=>x.id===done[done.length-1].doc).ph}">Contact clinic</a></div></div>`:""}<button class="btn g" style="margin-top:12px" data-a="go" data-v="chat">+ New appointment</button>`},
profile:()=>{const u=U();return`<h1>Profile</h1><div class="card" style="max-width:520px">Name<input id="pn2" value="${u.name||""}">Verified mobile: <b>${u.phone}</b> ${u.verified?"✓":"(not verified)"}<br>Language<select id="pl">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===u.lang?"selected":""}>${v[0]}</option>`).join("")}</select>Preferred doctor<select id="pd"><option value="">None</option>${D.map(d=>`<option value="${d.id}" ${d.id===u.prefDoc?"selected":""}>${d.n}</option>`).join("")}</select>Preferred time<select id="pt"><option>Morning</option><option ${u.prefT==="Evening"?"selected":""}>Evening</option></select><div class="row" style="margin-top:8px"><button class="btn" data-a="saveprof">Save</button><button class="btn o" data-a="logout">Logout</button><button class="btn r" data-a="wipe">Delete my data</button></div><div class="m">Session auto-logs out after 15 minutes of inactivity. Raw card details are never stored.</div></div>`},
doc:()=>{const now=ymd(new Date()),A=S.appts,c=s=>A.filter(a=>a.status===s).length,sel=window.adoc||"g1",d=D.find(x=>x.id===sel);

// actions
function act(a,d){if(micOn&&a==="go"&&d.v!=="chat"){micOn=false;try{rec&&rec.abort()}catch(e){}rec=null}switch(a){
 case"go":if(d.v.startsWith("dept:")){dept=d.v.slice(5);view="dept"}else if(d.v==="chat")openChat();else view=d.v;render();break;
 case"auth":auth={m:d.m};view="auth";render();break;
 case"demo":S.users["9876543210"]=S.users["9876543210"]||{phone:"9876543210",name:"Demo Patient",lang:"en",verified:false};S.cur="9876543210";save();view="lang";render();break;
 case"otp1":{const p=$("#rp").value.replace(/\D/g,"");if(p.length!==10){toast("Enter a 10-digit mobile number");return}
  if(auth.m==="login"&&!S.users[p]){toast("No account found — please register");return}

 case"otp2":if($("#oi").value!==otp){toast("Incorrect OTP");return}
  S.users[auth.p]=S.users[auth.p]||{phone:auth.p,name:auth.n||"",email:auth.e,lang:"en"};S.users[auth.p].verified=true;S.cur=auth.p;save();view=auth.m==="reg"?"lang":"home";render();break;
 case"setlang":U().lang=d.l;save();msgs=[];view="home";render();break;
 case"book":{const doc=D.find(x=>x.id===d.doc);dept=doc.d;msgs=[];flow={doc};openChat(flow);understand("");break}
 case"say":send(d.t);break;case"sendbtn":{const i=$("#inp");send(i.value);i.value="";break}
 case"mic":mic();break;case"spk":speakOn=!speakOn;render();break;
 case"emg":say("b",emgCard(flow.doc));break;
 case"pick":flow.doc=D.find(x=>x.id===d.doc);flow.date=d.date;flow.time=d.time;say("u",`${flow.doc.n} · ${fmtD(d.date)} ${fmtT(d.time)}`);afterPick();break;
 case"sendotp":{const p=$("#ph").value.replace(/\D/g,"");if(p.length!==10){toast("Enter 10 digits");return}U().phone!==p&&(S.users[p]=Object.assign(U(),{phone:p}),delete S.users[S.cur],S.cur=p);otp=String(1000+Math.floor(Math.random()*9000));$("#otpbox").innerHTML=`<div class="m">DEMO OTP (no SMS): <b>${otp}</b></div><input id="oi2" placeholder="OTP" inputmode="numeric"><button class="btn g s" data-a="vfy">Verify</button>`;break}
 case"vfy":if($("#oi2").value!==otp){toast("Incorrect OTP");return}U().verified=true;save();say("u","OTP ✓");payCard();break;
 case"pay":bookNow();break;
 case"ics":{const x=S.appts.find(a=>a.id===d.id);dl("appointment.ics",ics(x),"text/calendar");toast("Calendar event with reminder downloaded");break}
 case"dl":{const x=S.appts.find(a=>a.id===d.id),dd=D.find(y=>y.id===x.doc);dl("confirmation.txt",`MediGuide AI\nPatient: ${x.pn}\nDoctor: ${dd.n}\nHospital: ${dd.h}\nDate: ${x.date}\nTime: ${fmtT(x.time)}\nPaid: Rs ${x.fee}\nStatus: ${x.status}`,"text/plain");break}
 case"cancel":{const x=S.appts.find(a=>a.id===d.id);x.status="Cancelled";save();toast("Appointment cancelled");if(view==="chat")say("b","Cancelled ✓");else render();break}
 case"done":S.appts.find(a=>a.id===d.id).status="Completed";save();render();break;
 case"resch":{const x=S.appts.find(a=>a.id===d.id);msgs=[];dept=D.find(y=>y.id===x.doc).d;openChat({doc:D.find(y=>y.id===x.doc),re:x.id});understand("");break}
 case"fu":{const doc=D.find(x=>x.id===d.id);msgs=[];dept=doc.d;openChat({doc});say("b","Let’s find a follow-up appointment.");understand("");break}
 case"wait":S.wait.push({p:S.cur,dept:d.dept});save();toast("Added to waitlist — we’ll alert you when a slot opens");break;

 case"toast":toast(d.t);break}}
